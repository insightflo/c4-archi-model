<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Ordering System System Context</title>
  <desc id="desc">Customer가 Ordering System에 주문을 생성하는 관계를 보여준다.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#315fca"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#172033" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="620" fill="#f7f4ec"/>
  <text x="70" y="70" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#172033">Ordering System</text>
  <text x="70" y="105" font-family="system-ui, sans-serif" font-size="18" fill="#5d687b">System Context · 고객과 대상 시스템의 바깥 관계</text>
  <g filter="url(#shadow)">
    <rect x="90" y="225" width="260" height="180" rx="24" fill="#ffffff" stroke="#dfe4ec" stroke-width="2"/>
    <circle cx="220" cy="275" r="34" fill="#edf3ff"/>
    <circle cx="220" cy="265" r="10" fill="#315fca"/><path d="M190 306 Q220 280 250 306" fill="none" stroke="#315fca" stroke-width="8" stroke-linecap="round"/>
    <text x="220" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#172033">Customer</text>
    <text x="220" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#5d687b">[Person]</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="760" y="190" width="350" height="250" rx="28" fill="#315fca" stroke="#214aa8" stroke-width="2"/>
    <text x="935" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="850" fill="#ffffff">Ordering System</text>
    <text x="935" y="308" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#dbe6ff">[Software System]</text>
    <text x="935" y="350" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#ffffff">주문 접수와 배송 준비 시작을</text>
    <text x="935" y="378" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#ffffff">조정합니다.</text>
  </g>
  <path d="M350 315 C500 315 610 315 750 315" fill="none" stroke="#315fca" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="455" y="260" width="210" height="42" rx="10" fill="#ffffff" stroke="#dfe4ec"/>
  <text x="560" y="287" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="750" fill="#172033">주문을 생성합니다.</text>
  <g transform="translate(70 530)">
    <rect width="1060" height="54" rx="14" fill="#ffffff" stroke="#dfe4ec"/>
    <rect x="18" y="15" width="28" height="24" rx="5" fill="#315fca"/><text x="58" y="33" font-family="system-ui, sans-serif" font-size="14" fill="#5d687b">파란 박스: 대상 Software System</text>
    <rect x="330" y="15" width="28" height="24" rx="5" fill="#ffffff" stroke="#dfe4ec"/><text x="370" y="33" font-family="system-ui, sans-serif" font-size="14" fill="#5d687b">흰 박스: Person</text>
    <path d="M650 27 h60" stroke="#315fca" stroke-width="4" marker-end="url(#arrow)"/><text x="730" y="33" font-family="system-ui, sans-serif" font-size="14" fill="#5d687b">화살표: 목적이 있는 관계</text>
  </g>
</svg>
