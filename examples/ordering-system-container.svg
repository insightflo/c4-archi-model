<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
  <title id="title">Ordering System Container View</title>
  <desc id="desc">Customer, Web App, Order API, PostgreSQL Order Database, order-created topic, Fulfilment Worker의 관계를 보여준다.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#315fca"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172033" flood-opacity=".11"/></filter>
  </defs>
  <rect width="1440" height="850" fill="#f7f4ec"/>
  <text x="62" y="58" font-family="system-ui, sans-serif" font-size="34" font-weight="850" fill="#172033">Ordering System</text>
  <text x="62" y="91" font-family="system-ui, sans-serif" font-size="18" fill="#5d687b">Container View · 실행되는 애플리케이션과 데이터 저장소</text>
  <rect x="310" y="130" width="1060" height="620" rx="30" fill="#eef3ff" stroke="#9db8f4" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="340" y="170" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#315fca">Ordering System [Software System boundary]</text>
  <g filter="url(#shadow)">
    <rect x="55" y="320" width="205" height="160" rx="22" fill="#ffffff" stroke="#dfe4ec" stroke-width="2"/>
    <text x="158" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="850" fill="#172033">Customer</text>
    <text x="158" y="406" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#5d687b">[Person]</text>
    <text x="158" y="440" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#5d687b">주문 정보를 입력</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="370" y="245" width="230" height="180" rx="22" fill="#315fca" stroke="#214aa8" stroke-width="2"/>
    <text x="485" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="850" fill="#ffffff">Web App</text>
    <text x="485" y="332" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#dbe6ff">[Container]</text>
    <text x="485" y="370" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#ffffff">주문 입력 화면 제공</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="710" y="245" width="250" height="180" rx="22" fill="#315fca" stroke="#214aa8" stroke-width="2"/>
    <text x="835" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="850" fill="#ffffff">Order API</text>
    <text x="835" y="332" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#dbe6ff">[Container]</text>
    <text x="835" y="366" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#ffffff">저장과 이벤트 발행 조정</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1080" y="205" width="230" height="180" rx="22" fill="#247653" stroke="#19573d" stroke-width="2"/>
    <text x="1195" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="850" fill="#ffffff">Order Database</text>
    <text x="1195" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#d9f5e7">[Container: PostgreSQL]</text>
    <text x="1195" y="330" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#ffffff">주문 데이터 저장</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="710" y="545" width="250" height="150" rx="22" fill="#9a650c" stroke="#744b06" stroke-width="2"/>
    <text x="835" y="595" text-anchor="middle" font-family="system-ui, sans-serif" font-size="21" font-weight="850" fill="#ffffff">order-created topic</text>
    <text x="835" y="626" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#fff0bd">[Container candidate]</text>
    <text x="835" y="660" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#ffffff">주문 생성 이벤트 전달</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1080" y="520" width="230" height="180" rx="22" fill="#7351a4" stroke="#533776" stroke-width="2"/>
    <text x="1195" y="575" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="850" fill="#ffffff">Fulfilment Worker</text>
    <text x="1195" y="607" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#ede2ff">[Container]</text>
    <text x="1195" y="645" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#ffffff">배송 준비 시작</text>
  </g>
  <path d="M260 400 H360" stroke="#315fca" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="310" y="382" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="750" fill="#172033">주문 입력</text>
  <path d="M600 335 H700" stroke="#315fca" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="650" y="316" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="750" fill="#172033">HTTPS/JSON</text>
  <path d="M960 300 H1070" stroke="#315fca" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="1015" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="750" fill="#172033">주문 저장</text>
  <path d="M835 425 V535" stroke="#315fca" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="850" y="485" font-family="system-ui, sans-serif" font-size="13" font-weight="750" fill="#172033">이벤트 발행</text>
  <path d="M1080 620 H970" stroke="#315fca" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text x="1025" y="602" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="750" fill="#172033">이벤트 소비</text>
  <g transform="translate(62 785)"><text font-family="system-ui, sans-serif" font-size="14" fill="#5d687b">범례: 파랑=애플리케이션 · 초록=데이터 저장소 · 금색=메시지 채널 · 보라=Worker · 점선=Software System 경계</text></g>
</svg>
